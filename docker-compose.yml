version: '3.8'

services:
  portfolio-app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: anshuman-portfolio
    ports:
      - "8000:8000"
    environment:
      - DEBUG=false
      - HOST=0.0.0.0
      - PORT=8000
      - ALLOWED_HOSTS=localhost,127.0.0.1,anshumanmaurya.in,vstra.anshumanmaurya.in,admin.anshumanmaurya.in
      - WEB3FORMS_KEY=${WEB3FORMS_KEY:-}
      - SITE_URL=${SITE_URL:-https://anshumanmaurya.in}
      - GA_MEASUREMENT_ID=${GA_MEASUREMENT_ID:-}
    volumes:
      - ./templates:/app/templates:ro
      - ./static:/app/static:ro
      - ./data.py:/app/data.py:ro
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - portfolio-network
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # Optional: Nginx reverse proxy for SSL/TLS termination
  nginx:
    image: nginx:alpine
    container_name: anshuman-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./certs:/etc/nginx/certs:ro
    depends_on:
      - portfolio-app
    restart: unless-stopped
    networks:
      - portfolio-network
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

networks:
  portfolio-network:
    driver: bridge

volumes:
  portfolio-data:
